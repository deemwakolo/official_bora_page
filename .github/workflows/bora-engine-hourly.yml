name: BORA Engine hourly processing

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bora-engine-hourly
  cancel-in-progress: false

jobs:
  process-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected hourly Engine route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Missing repository Actions secret CRON_SECRET."
            exit 1
          fi

          response="$(curl --silent --show-error --max-time 120 \
            --write-out $'\n%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://deemwakolo-officialborapage.vercel.app/api/internal/bora-engine/reconcile-votes")"
          http_status="${response##*$'\n'}"
          response_body="${response%$'\n'*}"
          reconcile_status="$(jq -r '.status // empty' <<< "$response_body")"
          stop_reason="$(jq -r '.stopReason // empty' <<< "$response_body")"
          event_errors="$(jq -r '[.counts.invalidInput, .counts.conflictingIdentity, .counts.persistenceFailure, .counts.commitUnknown] | add // 0' <<< "$response_body")"

          if [[ "$http_status:$reconcile_status:$stop_reason:$event_errors" != "200:completed:source-exhausted:0" ]]; then
            echo "::error::Vote reconciliation did not complete (HTTP ${http_status}, status ${reconcile_status:-unknown}, stop ${stop_reason:-unknown}, event errors ${event_errors:-unknown})."
            exit 1
          fi
          echo "Vote reconciliation completed; scanned $(jq -r '.sourceRowsScanned // 0' <<< "$response_body") source events."

          response="$(curl --silent --show-error --max-time 120 \
            --write-out $'\n%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://deemwakolo-officialborapage.vercel.app/api/internal/bora-engine/hourly")"
          http_status="${response##*$'\n'}"
          response_body="${response%$'\n'*}"
          engine_status="$(jq -r '.status // empty' <<< "$response_body")"

          case "${http_status}:${engine_status}" in
            200:completed|200:already-completed)
              echo "Hourly Engine run completed: ${engine_status}."
              ;;
            200:catching-up)
              echo "Hourly Engine catch-up batch completed; more closed hours remain."
              ;;
            *)
              echo "::error::Hourly Engine run did not complete (HTTP ${http_status}, status ${engine_status:-unknown})."
              exit 1
              ;;
          esac
